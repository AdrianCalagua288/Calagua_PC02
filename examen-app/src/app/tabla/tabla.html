<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Reporte de Estudiantes</h3>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Nota 1</th>
              <th>Nota 2</th>
              <th>Nota 3</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let e of estudiantes">
              <td>{{ e.id }}</td>
              <td>{{ e.nombre }}</td>
              <td>{{ e.nota1 }}</td>
              <td>{{ e.nota2 }}</td>
              <td>{{ e.nota3 }}</td>
              <td>
                <button class="btn btn-sm btn-info text-white" (click)="verDetalle(e)">
                  Ver Detalle
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
